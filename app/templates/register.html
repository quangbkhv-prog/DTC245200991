
{% extends 'base.html' %}
{% block content %}

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">B</div>

    <h1>Tạo tài khoản</h1>
    <p class="auth-subtitle">Đăng ký tài khoản Billing System</p>

    <form method="post" action="{{ url_for('register') }}"
          class="auth-form">

      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username"
             placeholder="Nhập tên đăng nhập"
             minlength="3" maxlength="80"
             autocomplete="username" required>

      <label for="password">Mật khẩu</label>
      <input id="password" type="password"
             name="password"
             placeholder="Nhập mật khẩu"
             minlength="8" maxlength="128"
             autocomplete="new-password" required>

      <label for="confirm_password">Nhập lại mật khẩu</label>
      <input id="confirm_password" type="password"
             name="confirm_password"
             placeholder="Xác nhận mật khẩu"
             minlength="8" maxlength="128"
             autocomplete="new-password" required>
             
      <label for="invite_code">Mã mời đăng ký</label>
      <input id="invite_code" type="password" name="invite_code" placeholder="Nhập mã mời từ quản trị viên" required>

      <button type="submit" class="auth-submit">
        Tạo tài khoản
      </button>
    </form>

    <p class="auth-footer">
      Đã có tài khoản?
      <a href="{{ url_for('login') }}">Đăng nhập</a>
    </p>
  </div>
</div>

{% endblock %}
