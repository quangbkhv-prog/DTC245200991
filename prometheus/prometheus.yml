global:
  scrape_interval: 15s
scrape_configs:
  - job_name: flask
    static_configs:
      - targets: ['web:8000']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://nginx:8080/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
